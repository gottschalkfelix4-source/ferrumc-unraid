name: Test and publish container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gottschalkfelix4-source/ferrumc-unraid

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  container:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build native test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ferrumc:test
          platforms: linux/${{ matrix.arch }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Install Minecraft protocol test client
        run: npm ci --prefix tests/client
      - name: Test real server, dashboard, permissions and persistence
        run: python3 tests/container_smoke.py ferrumc:test
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker tag ferrumc:test "$TAG"
          docker push "$TAG"

  publish:
    needs: container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest after both smoke tests pass
        env:
          SHA: ${{ github.sha }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("docker/upstream.json"))["version"])')
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$SHA" \
            "$IMAGE:$SHA-amd64" "$IMAGE:$SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
